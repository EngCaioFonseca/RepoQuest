services:
  repoquest:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLOUD_SAVE: ${CLOUD_SAVE:-}
      DATABASE_PATH: /app/data/repoquest.db
    volumes:
      - repoquest-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  repoquest-data:
